[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advogada-find"
version = "0.1.0"
description = "Candidaturas da Dra. Ana Carolina Campos (advogada) a escritórios de advocacia, por canais públicos de recrutamento."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "tldextract>=5,<6",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
advogada-find = "advogada_find.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
advogada_find = ["dashboard.html"]
