name: CI / CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    name: Deploy VM (main)
    needs: test
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: advogada-find-production
      cancel-in-progress: false
    environment: production
    env:
      VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
      VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar acesso SSH com chave verificada
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in VM_SSH_HOST VM_SSH_USER VM_SSH_PRIVATE_KEY VM_SSH_KNOWN_HOSTS; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Configure os GitHub Actions secrets de production: %s\\n' "${missing[*]}"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Enviar release e atualizar VM com backup
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "/tmp/advogada-find-ci-${GITHUB_SHA}.tgz"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          scp "${SSH_OPTS[@]}" "/tmp/advogada-find-ci-${GITHUB_SHA}.tgz" "$VM_SSH_USER@$VM_SSH_HOST:/tmp/advogada-find-ci-${GITHUB_SHA}.tgz"
          ssh "${SSH_OPTS[@]}" "$VM_SSH_USER@$VM_SSH_HOST" "sudo -n /usr/local/sbin/advogada-find-ci-deploy /tmp/advogada-find-ci-${GITHUB_SHA}.tgz ${GITHUB_SHA}"
          {
            echo "## Deploy automático — advogada-find"
            echo "Revisão: \`${GITHUB_SHA}\`"
            echo "Destino: VM de produção (via SSH verificado)"
            echo "Resultado: backup, instalação, reinício e health check concluídos"
          } >> "$GITHUB_STEP_SUMMARY"
